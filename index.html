function fillSeeds(rows){
  let last="Other";
  return rows.map(r=>{if(r.seed)last=r.seed;return{...r,seed:last};});
}

const DATA={};
// Seed group → profession mappings for MOD and AHP splits
const MOD_MAP = {};
const AHP_MAP = {};
// Renamed simple divisions
const RENAME = {"GP":"General Practitioner","OT":"Occupational Therapist","SLT":"Speech Pathologist","Physio":"Physiotherapist","Podiatrist":"Podiatrist","NP":"Nurse Practitioner","Psychiatrist":"Psychiatrist","SIMG":"FIMG","AI":"AI / Artificial Intelligence"};
Object.entries(RAW).forEach(([d,rows])=>{
  const filled = fillSeeds(rows);
  if(RENAME[d]){
    DATA[RENAME[d]] = filled;
  } else if(d==="MOD"){
    Object.entries(MOD_MAP).forEach(([name,fn])=>{
      DATA[name] = filled.filter(r=>fn(r.seed||""));
    });
    // fallback: unsorted seeds go to Psychology
    const matched = filled.filter(r=>Object.values(MOD_MAP).some(fn=>fn(r.seed||"")));
    const unmatched = filled.filter(r=>!Object.values(MOD_MAP).some(fn=>fn(r.seed||"")));
    if(unmatched.length) DATA["Psychology"] = (DATA["Psychology"]||[]).concat(unmatched);
  } else if(d==="AHP"){
    Object.entries(AHP_MAP).forEach(([name,fn])=>{
      DATA[name] = filled.filter(r=>fn(r.seed||""));
    });
    const unmatched = filled.filter(r=>!Object.values(AHP_MAP).some(fn=>fn(r.seed||"")));
    if(unmatched.length) DATA["Physio"] = (DATA["Physio"]||[]).concat(unmatched);
  } else {
    DATA[d] = filled;
  }
});

function renderKeywordView(rows){
  const groups={};
  rows.forEach(r=>{const s=r.seed||"Other";(groups[s]=groups[s]||[]).push(r);});
  const mx=Math.max(...rows.map(r=>r.au_volume),1);
  const sortedGroups=Object.entries(groups).sort(([,a],[,b])=>{
    return (b.some(r=>r.au_volume>0)?1:0)-(a.some(r=>r.au_volume>0)?1:0);
  });
  let idx=1,html="",si=0;
  for(const[seed,kws]of sortedGroups){
    const ac=ACCENTS[si++%ACCENTS.length];
    const withVol=kws.filter(r=>r.au_volume>0).sort((a,b)=>b.au_volume-a.au_volume);
    const allZero=withVol.length===0;
    html+=`<div class="section">
      <div class="shdr"><span class="sdot" style="background:${ac}"></span>${seed}<span class="scnt">${kws.length} kw</span></div>
      <div class="tbl-wrap"><table>
        ${typeColgroup()}
        <thead><tr><th>#</th><th>Keyword</th><th style="text-align:center">Target</th>${typeHeader()}${active!=="SIMG"?"<th>AU Volume</th>":""}</tr></thead>
        <tbody>`;
    if(allZero){
      html+=`<tr class="zero-row"><td colspan="5"><span class="zero-label">No Search Volume</span></td></tr>`;
    } else {
      withVol.slice(0,5).forEach(r=>{
        const pct=mx>0?Math.round(r.au_volume/mx*100):0;
        html+=`<tr>
          <td class="n"><span class="bar" style="background:${ac}"></span>${idx++}</td>
          <td class="kw">${r.keyword}</td>
          <td class="tgt" style="text-align:center">${resolveTarget(r)||"—"}</td>
          ${typeCell(r)}
          ${active!=="SIMG"?'<td><div class="vc"><span class="vn">'+r.au_volume.toLocaleString()+'</span><div class="vbw"><div class="vbf" style="width:'+pct+'%"></div></div></div></td>':""}
        </tr>`;
      });
    }
    html+=`</tbody></table></div></div>`;
  }

  return html;
}

  <div style="margin-top:28px;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-left:2px">
    &#x1F916; AI Estimated City Demand &mdash; August 2026
    <span style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;opacity:.6">AI-estimated monthly searches by city (Perplexity, Aug 2026)</span>
  </div>
  <div class="section"><div class="tbl-wrap"><table>
    <colgroup><col class="c-num"><col class="c-kw"><col style="width:80px"><col class="c-vol"></colgroup>
    <thead><tr><th>#</th><th>City</th><th>State</th><th>Est. Monthly Searches</th></tr></thead>
    <tbody>`;
  rows.forEach((r,i)=>{
    const pct=Math.round(r.vol/mx*100);
    h+=`<tr>
      <td class="n">${i+1}</td>
      <td style="text-align:left;padding-left:12px;font-weight:${i<3?'700':'400'};font-size:13px">${r.city}</td>
      <td style="text-align:center;color:var(--muted);font-size:12px">${r.state}</td>
      <td><div class="vc"><span class="vn city-total">${r.vol.toLocaleString()}</span><div class="vbw"><div class="vbf" style="width:${pct}%"></div></div></div></td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

function renderCityView(rows){
  const isSIMG = active==="SIMG";
  const rowVol = r => isSIMG
    ? (r.from_countries||[]).filter(x=>SIMG_COLS.includes(x.c)).reduce((s,x)=>s+x.v,0)
    : (r.au_volume||0);

  // Build city map from keywords (top 5 per seed, au_volume > 0)
  const groups={};
  rows.forEach(r=>{const s=r.seed||"Other";(groups[s]=groups[s]||[]).push(r);});
  const visible=[];
  Object.values(groups).forEach(kws=>{
    kws.filter(r=>r.au_volume>0).sort((a,b)=>b.au_volume-a.au_volume).forEach(r=>visible.push(r));
  });
  const cityMap={};
  visible.forEach(r=>{
    const city=resolveTarget(r)||"Other";
    if(!city||city==="Australia") return;
    if(!cityMap[city]) cityMap[city]={total:0,keywords:[]};
    cityMap[city].total+=rowVol(r);
    cityMap[city].keywords.push(r);
  });
  const sorted=Object.entries(cityMap).filter(([,d])=>d.total>0).sort(([,a],[,b])=>b.total-a.total).slice(0,5);
  if(!sorted.length) return '<div class="empty">No keywords with volume in this division.</div>';

  const mx=Math.max(...sorted.map(([,d])=>d.total),1);
  const volHdr = isSIMG ? "Total Int'l Volume" : "Total AU Volume";

  // ── TABLE 1: Target City ─────────────────────────────────────────────────
  let html=`
  <div style="font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-left:2px">
    Target City &mdash; Keyword Search Demand
  </div>
  <div class="section"><div class="tbl-wrap"><table>
    <colgroup><col class="c-num"><col class="c-kw"><col style="width:120px"><col class="c-vol"></colgroup>
    <thead><tr><th>#</th><th>Target City</th><th>Keywords</th><th>${volHdr}</th></tr></thead>
    <tbody>`;
  sorted.forEach(([city,d],i)=>{
    const pct=Math.round(d.total/mx*100);
    const sorted_kws=d.keywords.sort((a,b)=>rowVol(b)-rowVol(a));
    const chips=sorted_kws.slice(0,3).map(r=>`<span class="kw-chip">${r.keyword} <b>${rowVol(r).toLocaleString()}</b></span>`).join("");
    const extraItems=sorted_kws.slice(3).map(r=>`<div class="kw-dd-item"><span>${r.keyword}</span><b>${rowVol(r).toLocaleString()}</b></div>`).join("");
    const moreHtml=extraItems.replace(/"/g,"&quot;");
    const more=sorted_kws.length>3?`<span class="kw-more" data-dd="${moreHtml}" onmouseenter="showDd(this)" onmouseleave="hideDd(this)">+${sorted_kws.length-3} more</span>`:"";
    html+=`<tr>
      <td class="n">${i+1}</td>
      <td class="tgt" style="text-align:left;padding-left:12px">
        <span style="font-weight:700;font-size:13px">${city}</span>
        <div class="kw-chips kw-chips-wrap">${chips}${more}</div>
      </td>
      <td style="text-align:center;color:var(--muted);font-size:12px">${d.keywords.length}</td>
      <td><div class="vc"><span class="vn city-total">${d.total.toLocaleString()}</span><div class="vbw"><div class="vbf" style="width:${pct}%"></div></div></div></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;

  // ── TABLE 3: Searcher Location ────────────────────────────────────────────
  if(isSIMG){
    // SIMG: aggregate from_countries from keywords visible in keyword view (top 5 per seed)
    const countryTotals={};
    visible.forEach(r=>{
      (r.from_countries||[]).forEach(fc=>{
        countryTotals[fc.c]=(countryTotals[fc.c]||0)+fc.v;
      });
    });
    const topCountries=Object.entries(countryTotals).sort(([,a],[,b])=>b-a).slice(0,10);
    if(topCountries.length){
      const cMax=topCountries[0][1];
      const cTotal=Object.values(countryTotals).reduce((s,v)=>s+v,0);
      html+=`
  <div style="margin-top:32px;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-left:2px">
    🌏 Searcher Origin &mdash; Top 10 Countries
    <span style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;opacity:.6">Countries where IMG candidates are searching from (SEMrush)</span>
  </div>
  <div class="section"><div class="tbl-wrap"><table>
    <colgroup><col class="c-num"><col class="c-kw"><col class="c-vol"><col style="width:80px"></colgroup>
    <thead><tr><th>#</th><th>Country</th><th>Search Volume</th><th style="text-align:center">% of Total</th></tr></thead>
    <tbody>`;
      topCountries.forEach(([country,vol],i)=>{
        const pctC=Math.round(vol/cMax*100);
        const pctOfTotal=((vol/cTotal)*100).toFixed(1);
        html+=`<tr>
          <td class="n">${i+1}</td>
          <td class="tgt" style="text-align:left;padding-left:12px;font-weight:600">${country}</td>
          <td><div class="vc"><span class="vn">${vol.toLocaleString()}</span><div class="vbw"><div class="vbf" style="width:${pctC}%"></div></div></div></td>
          <td style="text-align:center;font-size:12px;font-weight:600">${pctOfTotal}%</td>
        </tr>`;
      });
      html+=`</tbody></table></div></div>`;
    }
  }

  return html;
}

function render(){
  const rows=DATA[active]||[];
  document.getElementById("cnt").textContent=rows.length+" keyword"+(rows.length!==1?"s":"");
  const nq=NO_QUERY[active]||[];
  let html=active==="SIMG" ? (rows.length ? renderKeywordView(rows) : '<div class="empty">No IMG keywords found.</div>') : (rows.length ? renderCityView(rows) : '<div class="empty">No search volume data yet — run KMT for NZ to populate.</div>');
  if(nq.length){
    html+=`<div class="nq-section" style="margin-top:16px">`;
    nq.forEach(s=>{html+=`<div class="nq-row"><span class="nq-dot"></span>${s} — No Related Queries Found</div>`;});
    html+=`</div>`;
  }
  document.getElementById("content").innerHTML=html;
}

const _dd=document.getElementById("kw-floating-dd");
let _ddTimer=null;
function showDd(el){
  clearTimeout(_ddTimer);
  _dd.innerHTML=el.dataset.dd;
  _dd.style.display="block";
  const r=el.getBoundingClientRect();
  const ddW=300;
  let left=r.left;
  if(left+ddW>window.innerWidth-8) left=window.innerWidth-ddW-8;
  let top=r.bottom+4;
  _dd.style.left=left+"px";
  _dd.style.top=top+"px";
  _dd.onmouseenter=()=>clearTimeout(_ddTimer);
  _dd.onmouseleave=()=>{_dd.style.display="none";};
}
function hideDd(){
  _ddTimer=setTimeout(()=>{_dd.style.display="none";},120);
}

// Seek job counts per division per city (last 31 days) — populated by seek_job_counts.py
const SEEK = {
  "General Practitioner": {},
  "Occupational Therapist": {},
  "Speech Pathologist": {},
  "Physiotherapist": {},
  "Podiatrist": {},
  "Nurse Practitioner": {},
  "Psychiatrist": {}
};

var SIMG_COLS=(function(){
  if(!RAW.SIMG) return [];
  var t={};
  RAW.SIMG.forEach(function(r){(r.from_countries||[]).forEach(function(x){t[x.c]=(t[x.c]||0)+x.v;});});
  return Object.entries(t).sort(function(a,b){return b[1]-a[1];}).slice(0,8).map(function(x){return x[0];});
})();
// State-level target resolver — if keyword mentions a state but no city, use state name
const STATE_MAP = [
  {label:"Auckland",       patterns:[/\bauckland\b/i,/\bauck\b/i],         cities:["auckland"]},
  {label:"Wellington",     patterns:[/\bwellington\b/i,/\bwelly\b/i],      cities:["wellington"]},
  {label:"Christchurch",   patterns:[/\bchristchurch\b/i,/\bcanterbur/i,/\bchch\b/i], cities:["christchurch"]},
  {label:"Hamilton",       patterns:[/\bhamilton\b/i,/\bwaikato\b/i],      cities:["hamilton"]},
  {label:"Tauranga",       patterns:[/\btauranga\b/i,/\bbay of plenty/i],  cities:["tauranga"]},
  {label:"Dunedin",        patterns:[/\bdunedin\b/i,/\botago\b/i],         cities:["dunedin"]},
  {label:"Palmerston North",patterns:[/\bpalmerston north\b/i,/\bpalmy\b/i,/\bmanawatu/i],cities:["palmerston north"]},
  {label:"Napier",         patterns:[/\bnapier\b/i,/\bhawke.?s bay/i,/\bhastings\b/i], cities:["napier","hastings"]},
  {label:"Nelson",         patterns:[/\bnelson\b/i,/\bmarlborough\b/i],    cities:["nelson"]},
  {label:"Rotorua",        patterns:[/\brotorua\b/i],                       cities:["rotorua"]},
];
function resolveTarget(r){
  if(r.target && r.target!=='' && r.target!=='New Zealand') return r.target;
  var kw=(r.keyword||'').toLowerCase();
  for(var s of STATE_MAP){
    var hasState=s.patterns.some(p=>p.test(kw));
    if(hasState){
      var hasCity=s.cities.some(c=>kw.includes(c));
      if(!hasCity) return s.label;
    }
  }
  return r.target==='New Zealand' ? 'New Zealand' : '';
}

function typeColgroup(){
  if(active!=='SIMG') return '<colgroup><col class="c-num"><col class="c-kw"><col class="c-tgt"><col class="c-typ"><col class="c-vol"></colgroup>';
  var c='<colgroup><col class="c-num"><col class="c-kw"><col class="c-tgt">';
  SIMG_COLS.forEach(function(){c+='<col style="width:80px">';});
  return c+'</colgroup>';
}
function typeHeader(){
  if(active!=='SIMG') return '<th>Type</th>';
  return SIMG_COLS.map(function(c){return '<th style="text-align:center;font-size:10px;white-space:normal;overflow:visible;word-break:break-word">'+c+'</th>';}).join('');
}
function typeCell(r){
  if(active!=='SIMG') return '<td style="text-align:center"><span class="cand">Candidate</span></td>';
  var lk={};
  (r.from_countries||[]).forEach(function(x){lk[x.c]=x.v;});
  return SIMG_COLS.map(function(c){
    var v=lk[c]||0;
    return v>0?'<td style="text-align:center;font-weight:700;font-size:12px;color:var(--accent)">'+v+'</td>'
              :'<td style="text-align:center;color:var(--border);font-size:12px">—</td>';
  }).join('');
}
const TAB_LABELS={"SIMG":"FIMG"};
function buildTabs(){
  const wrap=document.getElementById("tabs");
  Object.keys(DATA).forEach(d=>{
    const hasData=DATA[d]&&DATA[d].length>0;
    const hasNQ=NO_QUERY[d]&&NO_QUERY[d].length>0;
    if(!hasData&&!hasNQ) return;
    const t=document.createElement("div");
    t.className="tab"+(d===active?" active":"");
    t.textContent=TAB_LABELS[d]||d;
    t.onclick=()=>{
      active=d;
      document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
      t.classList.add("active");render();
    };
    wrap.appendChild(t);
  });
}

buildTabs();render();
</script>
